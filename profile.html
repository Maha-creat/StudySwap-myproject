<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudySwap KZ — IT курстар платформасы">
    <title>Профиль — StudySwap KZ</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo"><b>StudySwap</b><span>KZ</span></a>
            <button class="burger" id="burger" aria-label="Мәзірді ашу">☰</button>
            <nav class="nav" id="nav"><ul class="nav__list"><li><a href="index.html" class="nav__link">Басты</a></li><li><a href="courses.html" class="nav__link">Курстар</a></li><li><a href="profile.html" class="nav__link active">Профиль</a></li></ul></nav>
        </div>
    </header>

    <main class="container">
        <h1 class="section-title">Жеке профиль</h1>
        <p class="section-sub">Деректерің браузерде сақталады</p>
        <form id="profileForm" class="form form--profile" novalidate>
            <label for="userName">Аты-жөні</label>
            <input type="text" id="userName" name="userName" placeholder="Мысалы: Маулет Махамбет">
            <span class="error" id="nameError"></span>
            <label for="userEmail">Email</label>
            <input type="email" id="userEmail" name="userEmail" placeholder="name@mail.com">
            <span class="error" id="emailError"></span>
            <label for="userBio">Өзі туралы</label>
            <textarea id="userBio" name="userBio" rows="4"></textarea>
            <button type="submit" class="btn btn--primary" style="margin-top:12px">Сақтау</button>
        </form>
        <div id="savedInfo" data-dyn class="saved-info"></div>
    </main>
    <footer class="footer"><div class="container"><p>© 2026 StudySwap KZ. Барлық құқықтар қорғалған.</p></div></footer>

    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
